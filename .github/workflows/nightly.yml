name: Fundamentales SEC (nocturno)
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Leer SEC y generar SQL
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: mkdir -p build && node scripts/fetch_fundamentals.mjs > build/seed.sql
      - name: Cargar en D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute klever --remote --file=build/seed.sql
